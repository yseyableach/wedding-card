<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jay & Tilly 座位查詢</title>
  <meta name="description" content="輸入姓名查詢您的桌次 · 2027.05.01 台北萬豪酒店 36F 寰宇廳">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Jay &amp; Tilly Wedding">
  <meta property="og:title" content="Jay &amp; Tilly 婚宴座位查詢">
  <meta property="og:description" content="輸入姓名查詢您的桌次 · 2027.05.01 台北萬豪酒店 36F 寰宇廳">
  <meta property="og:url" content="https://yseyableach.github.io/wedding-card/seating.html">
  <meta property="og:image" content="https://yseyableach.github.io/wedding-card/assets/photos/share.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="zh_TW">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#f6f5f1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f3f3ef;
      --paper-2: #e7eae4;
      --ink: #1c1f1c;
      --soft-ink: #5c635d;
      --gold: #2f4a3a;
      --rose: #c9d3cb;
      --line: rgba(47,74,58, .32);
      --card: rgba(250,250,247, .88);
      --shadow: 0 24px 80px rgba(18,26,20, .14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 14% 14%, rgba(201,211,203,.34), transparent 30%),
        radial-gradient(circle at 86% 10%, rgba(214,219,212,.42), transparent 28%),
        linear-gradient(180deg, var(--paper) 0%, #f3f3ef 44%, var(--paper-2) 100%);
      font-family: Futura, "Avenir Next", "Century Gothic", "Noto Sans TC", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .30;
      background-image:
        linear-gradient(rgba(47,74,58,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(47,74,58,.06) 1px, transparent 1px);
      background-size: 84px 84px;
      mask-image: linear-gradient(180deg, rgba(0,0,0,.64), transparent 78%);
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(720px, calc(100% - 28px));
      margin: 0 auto;
      padding: 42px 0 70px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 34px;
      background: var(--card);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .hero {
      padding: 38px 30px 28px;
      text-align: center;
      background:
        radial-gradient(circle at top right, rgba(201,211,203,.30), transparent 34%),
        linear-gradient(180deg, rgba(255,255,255,.30), transparent 55%);
    }

    .eyebrow {
      color: var(--gold);
      font-size: 11px;
      letter-spacing: .44em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 8vw, 58px);
      font-weight: 500;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .subtitle {
      margin: 18px auto 0;
      max-width: 520px;
      color: var(--soft-ink);
      font-size: 15px;
      line-height: 2;
    }

    .form {
      padding: 28px 30px 34px;
      display: grid;
      gap: 16px;
    }

    label {
      display: block;
      color: var(--gold);
      font-size: 11px;
      letter-spacing: .30em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      min-height: 54px;
      border: 1px solid rgba(47,74,58,.34);
      border-radius: 18px;
      padding: 0 16px;
      color: var(--ink);
      background: rgba(250,250,247,.82);
      font: inherit;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: rgba(47,74,58,.72);
      box-shadow: 0 0 0 4px rgba(47,74,58,.12);
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 6px;
    }

    button,
    .back-link,
    .line-link {
      min-height: 54px;
      border-radius: 999px;
      border: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font: inherit;
      font-weight: 600;
      letter-spacing: .12em;
      cursor: pointer;
    }

    button {
      color: #fff;
      background: linear-gradient(135deg, #2f4a3a, #c9d3cb);
      box-shadow: 0 16px 38px rgba(47,74,58,.22);
    }

    .back-link {
      color: #262a26;
      border: 1px solid rgba(47,74,58,.44);
      background: rgba(250,250,247,.72);
    }

    .line-link {
      color: #fff;
      background: linear-gradient(135deg, #06c755, #3aa76d);
      box-shadow: 0 14px 32px rgba(6,199,85,.18);
      margin-top: 12px;
      width: 100%;
    }

    .result {
      display: none;
      margin-top: 8px;
      padding: 22px;
      border: 1px solid rgba(47,74,58,.30);
      border-radius: 24px;
      background: rgba(250,250,247,.78);
      line-height: 1.9;
    }

    .result.show { display: block; }

    .result-title {
      color: var(--gold);
      font-size: 11px;
      letter-spacing: .30em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .seat-table {
      margin: 8px 0;
      font-size: 28px;
      letter-spacing: .06em;
      color: var(--ink);
    }

    .muted {
      color: var(--soft-ink);
      font-size: 14px;
    }

    .notice {
      margin-top: 18px;
      color: rgba(92,99,93,.86);
      font-size: 13px;
      line-height: 1.9;
      text-align: center;
    }

    @media (max-width: 560px) {
      .page { width: min(100%, calc(100% - 18px)); padding-top: 22px; }
      .hero { padding: 30px 20px 22px; }
      .form { padding: 22px 18px 26px; }
      .button-row { grid-template-columns: 1fr; }
      h1 { letter-spacing: .12em; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="hero">
        <div class="eyebrow">Jay & Tilly Wedding</div>
        <h1>座位查詢</h1>
        <p class="subtitle">請輸入姓名查詢座位。公開座位表僅保留姓名與桌號，不放手機末三碼或其他個資；若查不到，請找收禮桌、招待人員，或直接透過 LINE 聯絡新人。</p>
      </div>

      <form class="form" id="seatForm">
        <div>
          <label for="guestName">姓名</label>
          <input id="guestName" name="guestName" type="text" autocomplete="name" placeholder="例如：王小明" required>
        </div>

        <div class="button-row">
          <button type="submit">查詢座位</button>
          <a class="back-link" href="index.html">返回喜帖</a>
        </div>

        <div class="result" id="result" aria-live="polite"></div>

        <a class="line-link" href="https://line.me/ti/p/uoeoVgzZpK" target="_blank" rel="noopener noreferrer">LINE 聯絡新人</a>

        <div class="notice">婚宴地點：台北萬豪酒店 36F 寰宇廳｜11:30 恭候入席｜12:00 宴席開始</div>
      </form>
    </section>
  </main>

  <script>
    const LINE_URL = "https://line.me/ti/p/uoeoVgzZpK";
    const normalize = (value) => String(value || "").trim().replace(/\s+/g, "").toLowerCase();
    const resultEl = document.getElementById("result");
    const form = document.getElementById("seatForm");

    let seats = [];

    async function loadSeats() {
      try {
        const response = await fetch("assets/data/seats.json", { cache: "no-store" });
        if (!response.ok) throw new Error("Failed to load seating data");
        seats = await response.json();
      } catch (error) {
        resultEl.className = "result show";
        resultEl.innerHTML = `<div class='result-title'>System Notice</div><div class='muted'>目前無法讀取座位資料，請稍後再試或直接透過 LINE 聯絡我們。</div><a class='line-link' href='${LINE_URL}' target='_blank' rel='noopener noreferrer'>LINE 聯絡新人</a>`;
      }
    }

    function renderResult(matches) {
      if (!matches.length) {
        resultEl.className = "result show";
        resultEl.innerHTML = `<div class='result-title'>查無資料</div><div class='muted'>查無符合的座位資料。請確認姓名是否為報名時填寫的姓名；若仍查不到，請找現場收禮桌、招待協助確認，或直接透過 LINE 聯絡新人。</div><a class='line-link' href='${LINE_URL}' target='_blank' rel='noopener noreferrer'>LINE 聯絡新人</a>`;
        return;
      }

      resultEl.className = "result show";
      resultEl.innerHTML = matches.map((guest) => `
        <div class="result-title">Seat Found</div>
        <div>${guest.name} 您好，您的座位是：</div>
        <div class="seat-table">${guest.table}</div>
        <div class="muted">${guest.group ? `分類：${guest.group}<br>` : ""}${guest.note || "請於 11:30 入席。"}</div>
      `).join("<hr style='border:0;border-top:1px solid rgba(47,74,58,.30);margin:18px 0;'>");
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const name = normalize(document.getElementById("guestName").value);
      const matches = seats.filter((item) => normalize(item.name) === name);
      renderResult(matches);
    });

    loadSeats();
  </script>
</body>
</html>
