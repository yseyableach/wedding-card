<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jay & Tilly 紙本喜帖</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <style>
    /*
      紙本喜帖：A5 直式（148 × 210 mm），共 3 面
      1. 封面　2. 照片頁　3. 內頁（邀請文字、時間地點、QR Code）
      列印時請選「實際大小 / 100%」，並開啟「背景圖形」。
    */
    :root {
      --red: #a3161c;
      --red-deep: #7c0d12;
      --red-soft: #f6e3dc;
      --gold: #c9a24a;
      --gold-deep: #9c7a2e;
      --ivory: #fbf6ec;
      --ink: #2a1b17;
      --serif: "Noto Serif TC", "Songti TC", "PMingLiU", "Noto Serif CJK TC", serif;
      --latin: "Cormorant Garamond", "Times New Roman", serif;
    }

    @page { size: 148mm 210mm; margin: 0; }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #e9e3da;
      color: var(--ink);
      font-family: var(--serif);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: center;
      padding: 12px 16px;
      background: rgba(233,227,218,.92);
      backdrop-filter: blur(8px);
      font-size: 13px;
      color: #5b4a43;
    }

    .toolbar button {
      border: 0;
      border-radius: 999px;
      padding: 9px 20px;
      background: var(--red);
      color: #fff;
      font: inherit;
      font-weight: 600;
      letter-spacing: .1em;
      cursor: pointer;
    }

    .sheets {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      padding: 24px 16px 60px;
    }

    .sheet {
      position: relative;
      width: 148mm;
      height: 210mm;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(60,20,10,.22);
      page-break-after: always;
      break-after: page;
    }

    /* phones: scale the A5 sheet down to fit */
    @media screen and (max-width: 600px) {
      .sheet { zoom: calc((100vw - 32px) / 148mm); }
    }

    /* ---------- 1. 封面 ---------- */
    .cover {
      background:
        radial-gradient(circle at 50% 38%, rgba(255,255,255,.10), transparent 55%),
        repeating-linear-gradient(45deg, rgba(255,255,255,.025) 0 2px, transparent 2px 9px),
        linear-gradient(180deg, var(--red) 0%, var(--red-deep) 100%);
      color: var(--gold);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .frame {
      position: absolute;
      inset: 9mm;
      border: .6mm solid var(--gold);
      pointer-events: none;
    }

    .frame::before {
      content: "";
      position: absolute;
      inset: 1.8mm;
      border: .25mm solid var(--gold);
    }

    .corner {
      position: absolute;
      width: 14mm;
      height: 14mm;
      color: var(--gold);
    }
    .corner.tl { top: 6.5mm; left: 6.5mm; }
    .corner.tr { top: 6.5mm; right: 6.5mm; transform: scaleX(-1); }
    .corner.bl { bottom: 6.5mm; left: 6.5mm; transform: scaleY(-1); }
    .corner.br { bottom: 6.5mm; right: 6.5mm; transform: scale(-1); }

    .xi {
      font-family: var(--serif);
      font-weight: 900;
      font-size: 64mm;
      line-height: 1;
      color: #d9b65f;
      text-shadow: 0 .6mm 0 rgba(90,8,12,.35);
      margin-top: -6mm;
    }

    .cover-names {
      margin-top: 4mm;
      font-family: var(--latin);
      font-size: 9.5mm;
      letter-spacing: .28em;
      padding-left: .28em;
      color: #f1dca4;
    }

    .cover-names i { font-size: .7em; margin: 0 .25em; }

    .cover-rule {
      width: 38mm;
      height: .3mm;
      margin: 6mm auto 5mm;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .cover-date {
      font-family: var(--latin);
      font-size: 5mm;
      letter-spacing: .45em;
      padding-left: .45em;
      color: #f1dca4;
    }

    .cover-sub {
      margin-top: 3mm;
      font-size: 3.4mm;
      letter-spacing: .6em;
      padding-left: .6em;
      color: var(--gold);
    }

    /* ---------- 2. 照片頁 ---------- */
    .photo-page {
      background: var(--ivory);
      padding: 12mm 12mm 0;
      display: flex;
      flex-direction: column;
    }

    .photo-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
      border: .5mm solid var(--red);
      padding: 2.2mm;
    }

    .photo-wrap img {
      position: absolute;
      inset: 2.2mm;
      display: block;
      width: calc(100% - 4.4mm);
      height: calc(100% - 4.4mm);
      object-fit: cover;
      object-position: center 32%;
    }

    .photo-caption {
      flex: 0 0 34mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .photo-caption .vow {
      font-size: 6.2mm;
      font-weight: 600;
      letter-spacing: .5em;
      padding-left: .5em;
      color: var(--red);
    }

    .photo-caption .vow-en {
      margin-top: 2.5mm;
      font-family: var(--latin);
      font-style: italic;
      font-size: 4.2mm;
      letter-spacing: .08em;
      color: var(--gold-deep);
    }

    .seal {
      position: absolute;
      right: -4mm;
      bottom: -6mm;
      width: 17mm;
      height: 17mm;
      border-radius: 50%;
      background: var(--red);
      color: #f1dca4;
      display: grid;
      place-items: center;
      font-size: 9mm;
      font-weight: 900;
      box-shadow: 0 0 0 1.2mm var(--ivory), 0 0 0 1.5mm var(--gold);
    }

    /* ---------- 3. 內頁 ---------- */
    .inside {
      background:
        radial-gradient(circle at 50% 0%, var(--red-soft), transparent 60%),
        var(--ivory);
      padding: 15mm 14mm 12mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .inside .frame { inset: 7mm; border-color: var(--red); border-width: .5mm; }
    .inside .frame::before { border-color: var(--gold); }

    .mini-xi {
      font-size: 11mm;
      font-weight: 900;
      color: var(--red);
      line-height: 1;
    }

    .invite {
      margin-top: 5mm;
      font-size: 3.9mm;
      line-height: 2.05;
      letter-spacing: .12em;
    }

    .invite .couple {
      display: block;
      margin: 1mm 0;
      font-family: var(--latin);
      font-size: 7mm;
      font-weight: 600;
      letter-spacing: .14em;
      color: var(--red);
      line-height: 1.5;
    }

    .invite .couple i { font-size: .7em; color: var(--gold-deep); margin: 0 .2em; }

    .invite strong { color: var(--red); font-weight: 600; }

    .parents {
      margin-top: 3mm;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3mm 8mm;
      font-size: 3.4mm;
      letter-spacing: .1em;
      color: #5b4a43;
    }

    .parents b { display: block; font-weight: 600; color: var(--ink); font-size: 3.6mm; }

    .details {
      width: 100%;
      margin-top: 5mm;
      padding: 4mm 0;
      border-top: .25mm solid var(--gold);
      border-bottom: .25mm solid var(--gold);
      display: grid;
      grid-template-columns: 17mm 1fr;
      row-gap: 2.2mm;
      text-align: left;
      font-size: 3.5mm;
      line-height: 1.55;
    }

    .details dt {
      color: var(--red);
      font-weight: 600;
      letter-spacing: .3em;
    }

    .details dd { margin: 0; }
    .details small { color: #7a6a62; font-size: 2.9mm; }

    .qrs {
      margin-top: 9mm;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4mm;
    }

    .qr { text-align: center; }

    .qr svg {
      display: block;
      width: 21mm;
      height: 21mm;
      margin: 0 auto;
      padding: 1mm;
      background: #fff;
      color: var(--ink);
      border: .25mm solid rgba(163,22,28,.35);
    }

    .qr span {
      display: block;
      margin-top: 1.6mm;
      font-size: 2.9mm;
      letter-spacing: .15em;
      color: var(--red);
      font-weight: 600;
    }

    .placeholder { background: rgba(201,162,74,.22); border-radius: 1mm; padding: 0 .8mm; }

    @media print {
      body { background: none; }
      .toolbar { display: none; }
      .sheets { display: block; padding: 0; }
      .sheet { box-shadow: none; zoom: 1; }
      .sheet:last-child { page-break-after: auto; break-after: auto; }
      .placeholder { background: none; }
    }
  </style>
</head>

    <span>A5 直式 · 共 3 面 · 列印時選「實際大小」並開啟「背景圖形」</span>

  </div>
